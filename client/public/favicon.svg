  <rect x="11.5" y="27.5" width="9" height="9" rx="2" fill="#090d16" />
  <rect x="14" y="30" width="4" height="4" rx="1" fill="#ffffff" />

  <!-- 4. Bottom-Right Dynamic Folio Node -->
