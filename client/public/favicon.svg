<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Container Squircle in Obsidian Slate with Precision Rim -->
  <rect x="3" y="3" width="42" height="42" rx="12" fill="#090d16" stroke="#1e293b" stroke-width="1.5" />

  <!-- Top Glass Highlight -->
  <path d="M3 15C3 8.37258 8.37258 3 15 3H33C39.6274 3 45 8.37258 45 15V22H3V15Z" fill="white" fill-opacity="0.08" />

  <!-- 1. Top-Left Primary QR Finder Pattern -->
  <rect x="9.5" y="9.5" width="13" height="13" rx="3.5" fill="#ffffff" />
  <rect x="11.5" y="11.5" width="9" height="9" rx="2" fill="#090d16" />
  <rect x="14" y="14" width="4" height="4" rx="1" fill="#38bdf8" />

  <!-- 2. Top-Right Secondary Finder Pattern -->
  <rect x="25.5" y="9.5" width="13" height="13" rx="3.5" fill="#ffffff" />
  <rect x="27.5" y="11.5" width="9" height="9" rx="2" fill="#090d16" />
  <circle cx="32" cy="16" r="2" fill="#d4f04d" />

  <!-- 3. Bottom-Left Third Finder Pattern -->
