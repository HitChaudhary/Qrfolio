  <rect x="33" y="25.5" width="5.5" height="5.5" rx="1.5" fill="#38bdf8" />
  <circle cx="29" cy="35" r="3.5" fill="#d4f04d" />
  <path d="M34 32.5L37.5 36" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" />
